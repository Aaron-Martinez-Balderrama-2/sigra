# =============================================================================
# ms-asistencia - Configuracion de Base de Datos y Servidor
# Responsable: Guzman Rojas Luis David
# =============================================================================

server.port=8081
spring.application.name=ms-asistencia

# Base de datos SQL Relacional (Modo PostgreSQL con persistencia en memoria o archivo)
# Permite arranque 100% autonomo sin depender de Docker Desktop en ejecucion
spring.datasource.url=jdbc:h2:mem:sigra_asistencia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sigra
spring.datasource.password=sigra_dev

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator para Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
