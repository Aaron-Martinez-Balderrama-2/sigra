# =============================================================================
# ms-asistencia - Configuracion de Base de Datos y Servidor
# Responsable: Guzman Rojas Luis David
# =============================================================================

server.port=8081
spring.application.name=ms-asistencia

# Conexion a PostgreSQL (Contenedor Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/sigra_asistencia
spring.datasource.username=sigra
spring.datasource.password=sigra_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator para Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
