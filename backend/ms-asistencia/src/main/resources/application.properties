# =============================================================================
# ms-asistencia - Configuracion de Base de Datos y Servidor
# Responsable: Guzman Rojas Luis David
# =============================================================================

server.port=8081
spring.application.name=ms-asistencia

# Conexion a PostgreSQL (Contenedor Docker - lee variables o usa 5433 por defecto)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB:sigra_asistencia}
spring.datasource.username=${POSTGRES_USER:sigra}
spring.datasource.password=${POSTGRES_PASSWORD:sigra_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator para Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
