# =============================================================================
# ms-asistencia - Configuración de Testeo Real con Base de Datos Relacional SQL
# =============================================================================
spring.datasource.url=jdbc:h2:mem:sigra_asistencia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sigra
spring.datasource.password=sigra_dev

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
