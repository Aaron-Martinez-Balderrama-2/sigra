<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Unidad Educativa SIGRA — Portal del Docente</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B2545">
  <meta name="description" content="Plataforma Escolar SIGRA - Portal del Docente para Asistencia y Gestión de Aula">
  <link rel="icon" type="image/jpeg" href="assets/icono.jpg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icono.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('Registro SW omitido en desarrollo local:', err);
        });
      });
    }
  </script>
</body>
</html>
